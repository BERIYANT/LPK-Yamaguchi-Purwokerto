{% extends 'navbar/base.html' %}
{% block title %}Tambah Lowongan{% endblock %}

{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    :root {
        --primary: #e11d48;
        --primary-dark: #b91c1c;
        --accent: #0ea5e9;
        --muted: #6b7280;
        --surface: #ffffff;
        --bg: #f8fafc;
        --shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
        --border: #e5e7eb;
    }

    .form-page {
        font-family: 'Poppins', 'Segoe UI', sans-serif;
        color: #0f172a;
    }

    .page-hero {
        background: radial-gradient(circle at 20% 20%, rgba(225, 29, 72, 0.14), transparent 35%),
            linear-gradient(135deg, #fff7f8 0%, #f1f5f9 100%);
        border-radius: 18px;
        padding: 24px;
        margin-bottom: 26px;
        box-shadow: var(--shadow);
    }

    .page-hero h1 {
        font-size: 28px;
        font-weight: 700;
        margin: 8px 0 4px 0;
    }

    .page-hero p {
        margin: 0;
        color: var(--muted);
        font-weight: 500;
    }

    .card {
        background: var(--surface);
        border-radius: 14px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
    }

    .card-body {
        padding: 28px;
    }

    .form-label {
        font-weight: 600;
        color: #0f172a;
        margin-bottom: 8px;
        font-size: 14px;
    }

    .form-control,
    .form-select {
        border-color: var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.1);
    }

    textarea.form-control {
        resize: vertical;
    }

    .form-group-row {
        margin-bottom: 20px;
    }

    .btn {
        border-radius: 10px;
        font-weight: 600;
        padding: 10px 20px;
        transition: all 0.2s ease;
    }

    .btn-primary {
        background-color: var(--primary);
        border-color: var(--primary);
        color: white;
    }

    .btn-primary:hover {
        background-color: var(--primary-dark);
        border-color: var(--primary-dark);
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(225, 29, 72, 0.3);
    }

    .btn-secondary {
        background-color: #e5e7eb;
        border-color: #e5e7eb;
        color: #0f172a;
    }

    .btn-secondary:hover {
        background-color: #d1d5db;
        border-color: #d1d5db;
    }

    .button-group {
        display: flex;
        gap: 12px;
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
    }
</style>

<div class="form-page">
    <div class="page-hero">
        <p><i class="fas fa-plus me-1"></i>Tambah Lowongan Baru</p>
        <h1>Buat Lowongan Kerja</h1>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Judul Lowongan *</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Perusahaan</label>
                        <input type="text" name="company" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Lokasi</label>
                        <input type="text" name="location" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Deadline</label>
                        <input type="date" name="deadline" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="active">Aktif</option>
                            <option value="inactive">Nonaktif</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Jenis Pekerjaan</label>
                        <input type="text" name="employment_type" class="form-control"
                            placeholder="Full-time / Part-time / Kontrak">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Gaji / Benefit</label>
                        <input type="text" name="salary" class="form-control" placeholder="Opsional">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Deskripsi</label>
                        <textarea name="description" class="form-control" rows="4"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Kualifikasi / Persyaratan</label>
                        <textarea name="requirements" class="form-control" rows="4"
                            placeholder="Pisahkan dengan baris baru"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Link Pendaftaran</label>
                        <input type="url" name="application_link" class="form-control" placeholder="https://...">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email Kontak</label>
                        <input type="email" name="contact_email" class="form-control" placeholder="hr@company.com">
                    </div>
                </div>
                <div class="mt-4 d-flex gap-2">
                    <a href="{{ url_for('jobs.admin_jobs') }}" class="btn btn-secondary">Batal</a>
                    <button class="btn btn-primary" type="submit">Simpan</button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
