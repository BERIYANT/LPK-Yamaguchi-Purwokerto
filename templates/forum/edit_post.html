{% extends "navbar/base.html" %}
{% block title %}Edit Topik - {{ post.title }}{% endblock %}
{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    :root {
        --primary: #e11d48;
        --primary-dark: #b91c1c;
        --muted: #6b7280;
        --surface: #ffffff;
        --bg: #f8fafc;
        --shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
        --border: #e5e7eb;
    }

    .edit-forum-container {
        font-family: 'Poppins', 'Segoe UI', sans-serif;
        color: #0f172a;
    }

    .page-hero {
        position: relative;
        overflow: hidden;
        background: radial-gradient(circle at 20% 20%, rgba(225, 29, 72, 0.14), transparent 35%),
            radial-gradient(circle at 85% 30%, rgba(14, 165, 233, 0.14), transparent 32%),
            linear-gradient(135deg, #fff7f8 0%, #f1f5f9 100%);
        border-radius: 18px;
        padding: 24px;
        margin-bottom: 26px;
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .page-hero::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(225, 29, 72, 0.05), rgba(14, 165, 233, 0.04));
        pointer-events: none;
    }

    .page-hero h1 {
        font-size: 28px;
        font-weight: 700;
        color: #0f172a;
        margin: 0;
        position: relative;
        z-index: 1;
    }

    .page-hero .btn {
        position: relative;
        z-index: 1;
        background: linear-gradient(145deg, var(--muted), #4b5563);
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        font-weight: 600;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }

    .edit-card {
        background: var(--surface);
        border-radius: 14px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        padding: 28px;
    }

    .form-label {
        font-weight: 600;
        color: #0f172a;
        margin-bottom: 8px;
        display: block;
    }

    .form-control {
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 12px 16px;
        font-size: 14px;
        transition: all 0.2s;
    }

    .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.1);
        outline: none;
    }

    .btn-primary {
        background: linear-gradient(145deg, var(--primary), var(--primary-dark));
        border: none;
        padding: 12px 28px;
        border-radius: 10px;
        font-weight: 600;
        box-shadow: 0 6px 16px rgba(225, 29, 72, 0.3);
        transition: all 0.3s;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(225, 29, 72, 0.4);
    }

    .btn-outline-secondary {
        border: 2px solid var(--border);
        color: var(--muted);
        padding: 10px 24px;
        border-radius: 10px;
        font-weight: 600;
        transition: all 0.2s;
    }

    .btn-outline-secondary:hover {
        background: #f8fafc;
        border-color: var(--muted);
        color: #0f172a;
    }
</style>

<div class="edit-forum-container">
    <div class="page-hero">
        <h1><i class="fas fa-edit me-2"></i>Edit Topik Diskusi</h1>
        <a href="{{ url_for('forum.view_post', post_id=post.id) }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-1"></i>Kembali
        </a>
    </div>

    <div class="edit-card">
        <form method="POST">
            <div class="mb-4">
                <label for="title" class="form-label">
                    <i class="fas fa-heading me-1"></i>Judul Topik
                </label>
                <input type="text" id="title" name="title" class="form-control" required value="{{ post.title }}"
                    placeholder="Masukkan judul topik">
            </div>
            <div class="mb-4">
                <label for="body" class="form-label">
                    <i class="fas fa-align-left me-1"></i>Isi Diskusi
                </label>
                <textarea id="body" name="body" class="form-control" rows="8" required
                    placeholder="Tulis isi diskusi Anda">{{ post.body }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i>Simpan Perubahan
                </button>
                <a href="{{ url_for('forum.view_post', post_id=post.id) }}" class="btn btn-outline-secondary">
                    <i class="fas fa-times me-2"></i>Batal
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
