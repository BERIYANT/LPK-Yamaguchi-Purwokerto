<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LPK Yamaguchi</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, rgba(255, 192, 203, 0.3) 0%, rgba(255, 182, 193, 0.3) 100%),
            url('{{ url_for("static", filename="images/hero.png") }}') center/cover no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            animation: cardIn 600ms ease-out both;
        }

        .login-header {
            text-align: center;
            padding: 40px 30px 20px;
        }

        .login-icon {
            width: 140px;
            height: 140px;
            margin: 0 auto 25px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .login-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .login-subtitle {
            font-size: 14px;
            color: #999;
            margin-top: 5px;
        }

        .login-form {
            padding: 0 30px 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #c41e3a;
            box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.1);
        }

        .icon-input {
            position: relative;
        }

        .icon-input-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .icon-input-icon:hover {
            transform: translateY(-50%) scale(1.08);
            color: #c41e3a;
        }

        .password-input {
            padding-right: 40px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #c41e3a, #e63946);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-position 0.4s;
            background-size: 200% 200%;
            background-position: left center;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(196, 30, 58, 0.3);
            background-position: right center;
        }

        /* Animated background overlay */
        .login-container::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(196, 30, 58, 0.16), transparent 32%),
                radial-gradient(circle at 80% 20%, rgba(230, 57, 70, 0.12), transparent 32%),
                radial-gradient(circle at 30% 80%, rgba(255, 182, 193, 0.14), transparent 32%);
            animation: bgPulse 18s ease-in-out infinite alternate;
            pointer-events: none;
        }

        /* Ripple effect element */
        .btn-login .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 600ms ease-out;
            background: rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }

        /* Keyframes */
        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }

            100% {
                transform: translateY(0);
            }
        }

        @keyframes bgPulse {
            0% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-10px) scale(1.03);
            }

            100% {
                transform: translateY(0) scale(1);
            }
        }

        @keyframes ripple {
            to {
                transform: scale(3);
                opacity: 0;
            }
        }

        .demo-accounts {
            padding: 0 30px 30px;
            text-align: center;
            border-top: 1px solid #f0f0f0;
        }

        .demo-label {
            font-size: 13px;
            color: #999;
            margin-bottom: 12px;
            display: block;
        }

        .demo-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-demo {
            padding: 8px 20px;
            background: linear-gradient(135deg, #ffc0cb, #ffb6c1);
            color: #c41e3a;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-demo:hover {
            background: linear-gradient(135deg, #ffb6c1, #ffa6c1);
            transform: translateY(-1px);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            margin-top: 20px;
            width: 100%;
            background: rgba(196, 30, 58, 0.1);
            color: #c41e3a;
            text-decoration: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid #c41e3a;
            transition: all 0.3s ease;
            box-shadow: none;
            letter-spacing: 0.5px;
        }

        .back-button:hover {
            background: #c41e3a;
            color: white;
            box-shadow: 0 6px 20px rgba(196, 30, 58, 0.35);
        }

        .back-button span:first-child {
            font-size: 18px;
            font-weight: bold;
        }

        .back-button svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div style="width: 100%; max-width: 450px;">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-icon">
                        <img src="{{ url_for('static', filename='images/logo_yamaguchi.png') }}"
                            alt="LPK Yamaguchi Logo">
                    </div>
                    <h1 class="login-title">Masuk ke LMS</h1>
                    <p class="login-subtitle">LPK Yamaguchi Purwokerto</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}" class="login-form">
                    {{ form.csrf_token() }}

                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <div class="icon-input">
                            <input type="text" class="form-control" id="username" name="username"
                                placeholder="nama pengguna" required
                                value="{{ request.form.username if request.form }}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="icon-input">
                            <input type="password" class="form-control password-input" id="password" name="password"
                                placeholder="••••••••" required>
                            <span class="icon-input-icon" onclick="togglePassword()">◉</span>
                        </div>
                    </div>

                    <button type="submit" class="btn-login">Masuk</button>

                    <a href="{{ url_for('index') if url_for else '/' }}" class="back-button">
                        <span>←</span>
                        <span>Kembali ke Beranda</span>
                    </a>
                </form>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }

        // Button ripple interaction
        const btnLogin = document.querySelector('.btn-login');
        if (btnLogin) {
            btnLogin.addEventListener('click', function (e) {
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        }
    </script>
</body>

</html>
