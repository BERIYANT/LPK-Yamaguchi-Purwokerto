{% extends "navbar/base.html" %}

{% block title %}Ubah Password - LPK Yamaguchi{% endblock %}

{% block content %}
<style>
    /* Theme match with login page */
    .auth-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: linear-gradient(135deg, rgba(255, 192, 203, 0.3) 0%, rgba(255, 182, 193, 0.3) 100%),
        url('{{ url_for("static", filename="images/hero.png") }}') center/cover no-repeat;
        background-attachment: fixed;
        border-radius: 12px;
    }

    .auth-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
        overflow: hidden;
    }

    .auth-header {
        text-align: center;
        padding: 40px 30px 20px;
    }

    .auth-icon {
        width: 120px;
        height: 120px;
        margin: 0 auto 25px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .auth-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .auth-title {
        font-size: 24px;
        font-weight: 700;
        color: #333;
        margin: 0;
    }

    .auth-subtitle {
        font-size: 14px;
        color: #999;
        margin-top: 6px;
    }

    .auth-form {
        padding: 0 30px 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        font-weight: 500;
        color: #333;
        margin-bottom: 8px;
        font-size: 14px;
    }

    .form-control {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.3s;
    }

    .form-control:focus {
        outline: none;
        border-color: #c41e3a;
        box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.1);
    }

    .icon-input {
        position: relative;
    }

    .icon-input-icon {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #999;
        user-select: none;
    }

    .password-input {
        padding-right: 40px;
    }

    .btn-primary {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #c41e3a, #e63946);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(196, 30, 58, 0.3);
    }

    .back-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 28px;
        margin-top: 16px;
        width: 100%;
        background: rgba(196, 30, 58, 0.1);
        color: #c41e3a;
        text-decoration: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        border: 2px solid #c41e3a;
        transition: all 0.3s ease;
        box-shadow: none;
        letter-spacing: 0.5px;
    }

    .back-button:hover {
        background: #c41e3a;
        color: white;
        box-shadow: 0 6px 20px rgba(196, 30, 58, 0.35);
    }

    .back-button span:first-child {
        font-size: 18px;
        font-weight: bold;
    }
</style>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <img src="{{ url_for('static', filename='images/logo_yamaguchi.png') }}" alt="LPK Yamaguchi Logo">
            </div>
            <h1 class="auth-title">Ubah Password</h1>
            <p class="auth-subtitle">Amankan akun Anda</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="current_password" class="form-label">Password Saat Ini *</label>
                <div class="icon-input">
                    <input type="password" class="form-control password-input" id="current_password"
                        name="current_password" required>
                    <span class="icon-input-icon" onclick="toggleVisibility('current_password')">◉</span>
                </div>
            </div>

            <div class="form-group">
                <label for="new_password" class="form-label">Password Baru *</label>
                <div class="icon-input">
                    <input type="password" class="form-control password-input" id="new_password" name="new_password"
                        required>
                    <div class="form-text">Minimal 6 karakter.</div>
                    <span class="icon-input-icon" onclick="toggleVisibility('new_password')">◉</span>
                </div>
            </div>

            <div class="form-group">
                <label for="new_password_confirm" class="form-label">Konfirmasi Password Baru *</label>
                <div class="icon-input">
                    <input type="password" class="form-control password-input" id="new_password_confirm"
                        name="new_password_confirm" required>
                    <span class="icon-input-icon" onclick="toggleVisibility('new_password_confirm')">◉</span>
                </div>
            </div>

            <div class="alert"
                style="background: linear-gradient(135deg, #fef3c7, #fde68a); border: 1px solid #fcd34d; color: #b45309; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;">
                <strong>Perhatian:</strong> Pastikan password baru Anda kuat dan mudah diingat.
            </div>

            <button type="submit" class="btn btn-primary">Ubah Password</button>
            <a href="{{ url_for('profile') }}" class="back-button">
                <span>←</span>
                <span>Kembali ke Profil</span>
            </a>
        </form>
    </div>
</div>

<script>
    function toggleVisibility(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.type = el.type === 'password' ? 'text' : 'password';
    }
</script>
{% endblock %}
