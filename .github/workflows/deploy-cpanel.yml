name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lpk-yamaguchi-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check source
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m compileall -q -x '(^|/)(\.venv|venv|__pycache__)/' .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
        run: |
          set -eu
          [ -n "$SSH_HOST" ] || { echo "CPANEL_SSH_HOST belum diisi di GitHub Actions Secrets"; exit 1; }
          [ -n "$SSH_PORT" ] || { echo "CPANEL_SSH_PORT belum diisi di GitHub Actions Secrets"; exit 1; }
          [ -n "$SSH_USER" ] || { echo "CPANEL_SSH_USER belum diisi di GitHub Actions Secrets"; exit 1; }
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "CPANEL_SSH_PRIVATE_KEY belum diisi di GitHub Actions Secrets"; exit 1; }
          case "$SSH_PORT" in (*[!0-9]*|'') echo "CPANEL_SSH_PORT harus berupa angka"; exit 1;; esac
          case "$SSH_PRIVATE_KEY" in (*"BEGIN "*"PRIVATE KEY"*) :;; (*) echo "CPANEL_SSH_PRIVATE_KEY bukan private key OpenSSH yang valid"; exit 1;; esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy
          chmod 600 ~/.ssh/cpanel_deploy
          ssh-keygen -y -f ~/.ssh/cpanel_deploy >/dev/null || { echo "Private key tidak dapat dibaca. Pastikan isi secret lengkap dan key tidak memakai passphrase."; exit 1; }
          ssh-keyscan -T 15 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts || { echo "SSH cPanel tidak dapat dijangkau. Periksa hostname, port, dan firewall hosting."; exit 1; }

      - name: Update cPanel repository and deploy
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
        run: |
          ssh -i ~/.ssh/cpanel_deploy -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'DEPLOY'
          set -euo pipefail

          REPO=/home/lpkd3153/repositories/LPK-Yamaguchi-Purwokerto
          APP=/home/lpkd3153/yamaguchipwt
          PYTHON=/home/lpkd3153/virtualenv/yamaguchipwt/3.13/bin/python

          git -C "$REPO" fetch origin main
          git -C "$REPO" checkout main
          git -C "$REPO" reset --hard origin/main

          mkdir -p "$APP"
          tar -C "$REPO" -cf - \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__MACOSX' \
            --exclude='._*' \
            --exclude='.cpanel.yml' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.log' \
            --exclude='.coverage' \
            --exclude='database.db' \
            --exclude='static/uploads' \
            --exclude='tmp' \
            . | tar -C "$APP" -xf -

          rm -rf "$APP/__MACOSX"
          find "$APP" -name '._*' -type f -delete
          find "$APP" -type d -name '__pycache__' -prune -exec rm -rf {} +
          find "$APP" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          # Jangan menimpa .htaccess buatan Setup Python App. cPanel menyimpan
          # konfigurasi Passenger dan environment variables aplikasi di sana.
          test -f /home/lpkd3153/public_html/.htaccess
          test -f "$APP/passenger_wsgi.py"
          test -f "$APP/app.py"
          test -f "$APP/.env" || {
            echo "::error title=Missing production environment file::$APP/.env belum dibuat di cPanel"
            exit 1
          }
          chmod 600 "$APP/.env"
          for name in DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME SECRET_KEY FLASK_ENV SESSION_COOKIE_SECURE; do
            if grep -q "^[[:space:]]*$name=" "$APP/.env"; then
              echo "Private .env key $name: present"
            else
              echo "::error title=Invalid production environment file::$name tidak ditemukan dengan format $name=nilai di $APP/.env"
              exit 1
            fi
          done

          # Diagnosis aman: hanya periksa keberadaan nama variabel, jangan
          # pernah mencetak nilainya ke log GitHub Actions.
          for name in DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME SECRET_KEY; do
            if grep -q "^[[:space:]]*PassengerEnvVar[[:space:]]\+$name[[:space:]]" /home/lpkd3153/public_html/.htaccess; then
              echo "cPanel .htaccess variable $name: present"
            else
              echo "::warning title=Missing cPanel Passenger variable::$name tidak ditemukan di public_html/.htaccess"
            fi
          done

          "$PYTHON" -m pip install -r "$APP/requirements.txt"
          cd "$APP"
          "$PYTHON" -m compileall -q -x '(^|/)(\.venv|venv|__pycache__)/' .
          "$PYTHON" - <<'PY'
          import sys
          from config import Config
          from utils.database import get_db
          from app import app

          db_user = Config.DB_CONFIG.get('user')
          db_name = Config.DB_CONFIG.get('database')
          print(f"Resolved production DB user: {db_user}")
          print(f"Resolved production DB name: {db_name}")
          if db_user == 'root':
              print("::error title=Private environment not applied::config.py masih menyelesaikan DB_USER sebagai root")
              sys.exit(1)
          try:
              with app.app_context():
                  cur = get_db().cursor()
                  cur.execute('SELECT 1')
                  assert cur.fetchone()[0] == 1
                  cur.close()
          except Exception as error:
              message = str(error).replace('\n', ' ').replace('\r', ' ')
              print(f"::error title=Production database credentials rejected::{type(error).__name__}: {message}")
              sys.exit(1)
          print("Production database query verified")
          PY
          grep -q "load_private_environment()" "$APP/config.py"
          grep -q "return render_template('index.html')" "$APP/routes_main.py"
          ! grep -q 'SELECT \* FROM materials ORDER BY created_at DESC LIMIT 6' "$APP/routes_main.py"

          mkdir -p "$APP/tmp"
          touch "$APP/tmp/restart.txt"
          # LiteSpeed cPanel kadang tidak merespons restart marker saja.
          # Sentuh entry point agar Passenger pasti memuat ulang Config/.env.
          touch "$APP/passenger_wsgi.py"

          echo "Production deployed at commit $(git -C "$REPO" rev-parse --short HEAD)"
          DEPLOY

      - name: Verify production website
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
        run: |
          set -eu
          RESPONSE_FILE=$(mktemp)
          if ! curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 30 \
            --output "$RESPONSE_FILE" https://www.lpkyamaguchi-pwt.com/; then
            echo "Website production gagal merespons. Log aplikasi terbaru:"
            ssh -i ~/.ssh/cpanel_deploy -p "$SSH_PORT" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              "$SSH_USER@$SSH_HOST" \
              'tail -n 120 /home/lpkd3153/yamaguchipwt/wsgi_debug.log 2>/dev/null || echo "wsgi_debug.log belum tersedia"'
            exit 1
          fi
          RESPONSE=$(cat "$RESPONSE_FILE")
          rm -f "$RESPONSE_FILE"
          printf '%s' "$RESPONSE" | grep -Fq '<title>LPK Yamaguchi Purwokerto — Siap Kerja ke Jepang</title>' || {
            echo "Domain merespons, tetapi landing page versi terbaru belum tampil."
            printf 'Title yang diterima: '
            printf '%s' "$RESPONSE" | grep -o '<title>[^<]*</title>' | head -n 1 || echo "tidak ditemukan"
            exit 1
          }

          LOGIN_COOKIE=$(mktemp)
          LOGIN_PAGE=$(mktemp)
          trap 'rm -f "$LOGIN_COOKIE" "$LOGIN_PAGE"' EXIT
          curl --fail --silent --show-error --location \
            --cookie-jar "$LOGIN_COOKIE" \
            --output "$LOGIN_PAGE" \
            https://www.lpkyamaguchi-pwt.com/login
          grep -Fq 'class="login-card"' "$LOGIN_PAGE" || {
            echo "Form login production tidak tampil."
            exit 1
          }
          CSRF_TOKEN=$(sed -n 's/.*name="csrf_token"[^>]*value="\([^"]*\)".*/\1/p' "$LOGIN_PAGE" | head -n 1)
          [ -n "$CSRF_TOKEN" ] || {
            echo "Token CSRF form login tidak ditemukan."
            exit 1
          }

          # Username probe sengaja tidak ada. Respons harus kembali ke form
          # login, bukan 500; ini menguji koneksi database dari request WSGI.
          HTTP_STATUS=$(curl --silent --show-error \
            --cookie "$LOGIN_COOKIE" \
            --cookie-jar "$LOGIN_COOKIE" \
            --output "$LOGIN_PAGE" \
            --write-out '%{http_code}' \
            --request POST \
            --data-urlencode "csrf_token=$CSRF_TOKEN" \
            --data-urlencode 'username=deployment_health_probe' \
            --data-urlencode 'password=invalid-deployment-health-probe' \
            https://www.lpkyamaguchi-pwt.com/login)
          if [ "$HTTP_STATUS" != "200" ] || ! grep -Fq 'Username atau password salah.' "$LOGIN_PAGE"; then
            echo "POST login production gagal (HTTP $HTTP_STATUS). Log aplikasi terbaru:"
            MYSQL_ERROR=$(ssh -i ~/.ssh/cpanel_deploy -p "$SSH_PORT" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              "$SSH_USER@$SSH_HOST" \
              "grep -E 'mysql\.connector\.errors\.|Access denied for user|Unknown database' /home/lpkd3153/yamaguchipwt/wsgi_debug.log 2>/dev/null | tail -n 1" || true)
            if [ -n "$MYSQL_ERROR" ]; then
              MYSQL_ERROR=$(printf '%s' "$MYSQL_ERROR" | tr '\r\n' '  ')
              echo "::error title=Production login database error::$MYSQL_ERROR"
            fi
            ssh -i ~/.ssh/cpanel_deploy -p "$SSH_PORT" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              "$SSH_USER@$SSH_HOST" \
              'tail -n 120 /home/lpkd3153/yamaguchipwt/wsgi_debug.log 2>/dev/null || echo "wsgi_debug.log belum tersedia"'
            exit 1
          fi
